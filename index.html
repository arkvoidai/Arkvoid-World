<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FBFAF7" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Arkvoid" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://world.arkvoid.com/" />
    <title>Arkvoid | A World That Remembers You</title>
    <meta
      name="description"
      content="Enter Arkvoid, a persistent fantasy world where characters remember you, build relationships, and continue their lives while you are away."
    />
    <meta property="og:site_name" content="Arkvoid" />
    <meta property="og:title" content="Arkvoid | A World That Remembers You" />
    <meta
      property="og:description"
      content="A persistent fantasy world where characters remember you and continue living while you are away."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://world.arkvoid.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Arkvoid | A World That Remembers You" />
    <meta
      name="twitter:description"
      content="A persistent fantasy world where characters remember you and continue living while you are away."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://ahnwqnmiotduzrsfacgv.supabase.co" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://world.arkvoid.com/#website",
            "url": "https://world.arkvoid.com/",
            "name": "Arkvoid",
            "alternateName": "Arkvoid World"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://world.arkvoid.com/#application",
            "name": "Arkvoid",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Web browser",
            "url": "https://world.arkvoid.com/",
            "description": "A persistent fantasy world where characters remember you and continue their lives while you are away.",
            "publisher": {
              "@type": "Organization",
              "name": "Arkvoid"
            }
          }
        ]
      }
    </script>
    <script>
      (() => {
        performance.mark?.('arkvoid:navigation-start');
        const startedAt = performance.now();
        const query = new URLSearchParams(location.search);
        const override = query.get('time');
        const overrideHour = override === null ? null : Number(override);
        const elapsedWorldMinutes = (Date.now() / 1000 - 1790812800) / 10;
        const continuousWorldHour = 6 + elapsedWorldMinutes / 60;
        const worldHour = overrideHour !== null && Number.isFinite(overrideHour)
          ? ((overrideHour % 24) + 24) % 24
          : ((continuousWorldHour % 24) + 24) % 24;
        const phase = worldHour >= 5 && worldHour < 8 ? 'dawn' : worldHour >= 8 && worldHour < 17 ? 'day' : worldHour >= 17 && worldHour < 20 ? 'dusk' : 'night';
        const orientation = matchMedia('(orientation: portrait)').matches ? 'portrait' : 'landscape';
        const href = '/posters/hero-' + phase + '-' + orientation + '.webp';
        fetch('/posters/manifest.json', { cache: 'no-cache' })
          .then((response) => response.ok ? response.json() : null)
          .then((manifest) => {
            if (!manifest || !Array.isArray(manifest.posters) || !manifest.posters.includes(href)) return;
            const preload = document.createElement('link');
            preload.rel = 'preload';
            preload.as = 'image';
            preload.href = href;
            document.head.appendChild(preload);
            const poster = new Image();
            poster.decoding = 'async';
            poster.onload = () => {
              document.documentElement.style.setProperty('--arkvoid-hero-poster', 'url("' + href + '")');
              document.documentElement.dataset.heroPoster = 'ready';
            };
            poster.onerror = () => {
              preload.remove();
              document.documentElement.dataset.heroPoster = 'fallback';
            };
            poster.src = href;
          })
          .catch(() => { document.documentElement.dataset.heroPoster = 'fallback'; });
        document.documentElement.style.setProperty('--arkvoid-boot-start', String(startedAt));
        try {
          const observer = new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
              if (entry.name === 'first-paint') performance.mark?.('arkvoid:first-paint');
            }
          });
          observer.observe({ type: 'paint', buffered: true });
        } catch {}
      })();
    </script>
    <style>
      :root { color-scheme: light; --arkvoid-hero-poster: none; }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #FBFAF7;
        color: #17141F;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #FBFAF7;
      }
      .arkvoid-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #FBFAF7;
        background-image:
          var(--arkvoid-hero-poster),
          radial-gradient(ellipse at 50% 46%, rgba(255, 178, 122, 0.20) 0%, rgba(185, 166, 255, 0.12) 34%, transparent 74%),
          linear-gradient(160deg, #fffefa 0%, #FBFAF7 58%, #F4F1EA 100%);
        background-size: cover, auto, auto;
        background-position: center, center, center;
      }
      .arkvoid-boot-wordmark {
        font-family:
          'Instrument Serif',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          serif;
        font-weight: 400;
        font-size: 1.15rem;
        letter-spacing: 0.34em;
        color: #17141F;
        opacity: 0.78;
        user-select: none;
      }
      #arkvoid-offline-status {
        position: fixed;
        z-index: 9999;
        inset-inline: 16px;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: fit-content;
        max-width: calc(100vw - 32px);
        margin-inline: auto;
        padding: 7px 12px;
        border: 1px solid rgba(23, 20, 31, 0.10);
        border-radius: 999px;
        background: rgba(251, 250, 247, 0.92);
        color: rgba(23, 20, 31, 0.64);
        font: 11px/1.35 system-ui, sans-serif;
        text-align: center;
        backdrop-filter: blur(12px);
      }
      #arkvoid-offline-status[hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="arkvoid-boot" role="status" aria-label="Loading Arkvoid">
        <span class="arkvoid-boot-wordmark">ARKVOID</span>
      </div>
    </div>
    <div id="arkvoid-offline-status" role="status" aria-live="polite" hidden>Offline · Your world will reconnect when the network returns.</div>
    <script>
      performance.mark?.('arkvoid:boot-ui-visible');
      (() => {
        const status = document.getElementById('arkvoid-offline-status');
        const update = () => { if (status) status.hidden = navigator.onLine; };
        window.addEventListener('online', update, { passive: true });
        window.addEventListener('offline', update, { passive: true });
        update();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
