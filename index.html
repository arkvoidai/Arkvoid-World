<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#FBFAF7" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Arkvoid" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://world.arkvoid.com/" />
    <title>Arkvoid | A World That Remembers You</title>
    <meta
      name="description"
      content="Enter Arkvoid, a persistent fantasy world where characters remember you, build relationships, and continue their lives while you are away."
    />
    <meta property="og:site_name" content="Arkvoid" />
    <meta property="og:title" content="Arkvoid | A World That Remembers You" />
    <meta
      property="og:description"
      content="A persistent fantasy world where characters remember you and continue living while you are away."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://world.arkvoid.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Arkvoid | A World That Remembers You" />
    <meta
      name="twitter:description"
      content="A persistent fantasy world where characters remember you and continue living while you are away."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://world.arkvoid.com/#website",
            "url": "https://world.arkvoid.com/",
            "name": "Arkvoid",
            "alternateName": "Arkvoid World"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://world.arkvoid.com/#application",
            "name": "Arkvoid",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Web browser",
            "url": "https://world.arkvoid.com/",
            "description": "A persistent fantasy world where characters remember you and continue their lives while you are away.",
            "publisher": {
              "@type": "Organization",
              "name": "Arkvoid"
            }
          }
        ]
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1d1724;
        color: #f6f0e9;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #1d1724;
      }
      .arkvoid-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #1d1724;
        background-image:
          radial-gradient(
            circle at 50% 46%,
            rgba(194, 119, 92, 0.18) 0%,
            rgba(92, 63, 96, 0.16) 34%,
            rgba(29, 23, 36, 0) 74%
          ),
          linear-gradient(160deg, #211a2a 0%, #1d1724 58%, #18141e 100%);
      }
      .arkvoid-boot-wordmark {
        font-family:
          'Instrument Serif',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          serif;
        font-weight: 400;
        font-size: 1.15rem;
        letter-spacing: 0.34em;
        color: #f6f0e9;
        opacity: 0.82;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="arkvoid-boot" role="status" aria-label="Loading Arkvoid">
        <span class="arkvoid-boot-wordmark">ARKVOID</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
